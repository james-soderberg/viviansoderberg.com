<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One Summer — Vivian's Place</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#463f38; --ink-soft:#554d45; --ink-quiet:#554e44; --tan:#644c2c;
    --hair:rgba(70,63,56,.12);
    --serif:"Cormorant Garamond",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--ink);min-height:100vh;
    font-family:var(--serif);font-weight:400;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,#d3d1cb 0%,#d8d6d0 30%,#d9d7d1 58%,#d6cfc3 82%,#d0c2ae 100%) no-repeat;
    background-size:100% 100%;
  }
  img{display:block;max-width:100%;height:auto}
  a{color:inherit}
  .wrap{max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,56px);width:100%}
  .caps{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:500}

  header{padding:clamp(20px,3vw,32px) 0 0}
  .head-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
  .head-spacer{justify-self:start}
  .shopname{
    justify-self:center;text-decoration:none;font-weight:300;
    font-size:clamp(23px,3.1vw,38px);line-height:1.05;letter-spacing:.03em;white-space:nowrap;
  }
  .cart{
    justify-self:end;display:inline-flex;align-items:center;gap:8px;
    text-decoration:none;color:var(--ink);padding:6px 2px;transition:color .35s;
  }
  .cart:hover{color:var(--tan)}
  .cart svg{width:22px;height:22px;display:block}
  .cart .count{font-size:12px;letter-spacing:.16em;color:var(--ink-quiet)}
  .menu{
    display:flex;justify-content:center;gap:clamp(18px,3.4vw,52px);flex-wrap:wrap;
    margin-top:clamp(16px,2.4vw,26px);padding-bottom:clamp(16px,2.4vw,24px);
    border-bottom:1px solid var(--hair);
  }
  .menu a{
    text-decoration:none;color:var(--ink-soft);font-size:12px;letter-spacing:.24em;
    text-transform:uppercase;padding-bottom:3px;border-bottom:1px solid transparent;
    transition:color .35s,border-color .35s;
  }
  .menu a:hover,.menu a[aria-current]{color:var(--tan);border-bottom-color:var(--tan)}

  main{flex:1}
  .back{
    display:inline-block;margin:clamp(22px,3vw,34px) 0 0;text-decoration:none;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-quiet);
  }
  .back:hover{color:var(--tan)}
  .product{
    padding:clamp(24px,3.4vw,44px) 0 clamp(48px,7vw,96px);
    display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);
    gap:clamp(30px,5vw,80px);align-items:start;
  }
  .shot img{
    width:100%;box-shadow:0 30px 58px -38px rgba(70,63,56,.5);
  }
  .thumbs{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
  .thumbs button{
    border:1px solid transparent;background:none;padding:0;cursor:pointer;
    width:76px;height:76px;overflow:hidden;transition:border-color .3s,opacity .3s;opacity:.7;
  }
  .thumbs button img{width:100%;height:100%;object-fit:cover}
  .thumbs button[aria-pressed="true"],.thumbs button:hover{border-color:var(--tan);opacity:1}

  .detail h1{
    font-weight:300;font-size:clamp(28px,3.4vw,44px);line-height:1.16;
    margin:0 0 16px;letter-spacing:.01em;
  }
  .spec{
    font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ink-quiet);line-height:2.1;margin:0 0 22px;
  }
  .price{font-size:clamp(24px,2.2vw,30px);letter-spacing:.02em;margin:0 0 10px}
  .status{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-quiet);margin:0 0 26px}
  .buy{
    display:inline-block;text-decoration:none;color:var(--tan);
    font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;
    padding:15px 40px;border:1px solid rgba(100,76,44,.45);
    transition:background .45s,color .45s,border-color .45s;
  }
  .buy:hover{background:var(--tan);border-color:var(--tan);color:#eae7e1}
  .note{font-size:15.5px;line-height:1.85;color:var(--ink-soft);margin:26px 0 0;max-width:38ch}
  .note a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(70,63,56,.3)}
  .note a:hover{color:var(--tan);border-bottom-color:var(--tan)}

  footer{border-top:1px solid var(--hair);margin-top:auto}
  footer .wrap{
    display:flex;justify-content:center;gap:clamp(18px,3vw,40px);flex-wrap:wrap;
    padding-top:24px;padding-bottom:32px;color:var(--ink-quiet);
  }
  footer a{text-decoration:none}
  footer a:hover{color:var(--tan)}

  @media(max-width:840px){
    .product{grid-template-columns:1fr;gap:30px}
  }
  @media(max-width:680px){
    .menu{gap:14px} .menu a{font-size:11px;letter-spacing:.14em}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-row">
      <span class="head-spacer"></span>
      <a class="shopname" href="index.html">Vivian's Place</a>
      <a class="cart" href="inquiries.html" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1.6 2.2h2.6l2.1 11.2a1.7 1.7 0 0 0 1.7 1.4h8.6a1.7 1.7 0 0 0 1.7-1.35l1.5-7.15H4.9" />
          <circle cx="9.2" cy="20.1" r="1.5" /><circle cx="17.6" cy="20.1" r="1.5" />
        </svg>
        <span class="count">0</span>
      </a>
    </div>
    <nav class="menu">
      <a href="index.html#originals" aria-current="page">Original Works</a>
      <a href="index.html#prints">Fine Art Prints</a>
      <a href="index.html#objects">Objects</a>
      <a href="inquiries.html">Inquiries</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="back" href="index.html#originals">&larr; Original Works</a>
    <div class="product">
      <div class="shot">
        <img id="main" src="images/one-summer.jpg" alt="One Summer — a golden ochre field beneath a heavy storm sky" />

      </div>
      <div class="detail">
        <h1>One Summer</h1>
        <p class="spec">Original</p>
        <p class="status">Sold out</p>
        <p class="note">This piece has found a home. <a href="inquiries.html">Commission something similar</a>.</p>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap caps">
    <span>Vivian's Place</span>
    <a href="https://www.instagram.com/_viviansplace_/" target="_blank" rel="noopener">Instagram</a>
    <span>&copy; 2026</span>
  </div>
</footer>


</body>
</html>
